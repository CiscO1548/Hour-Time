<nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 lg:px-8 xl:px-10 transition-colors duration-200">
  <div class="max-w-[1720px] mx-auto flex space-x-1 sm:space-x-2 overflow-x-auto no-scrollbar py-2.5">
    @for (tab of tabs; track tab.id) {
      @let isActive = state.currentTab() === tab.id;
      @let count = getTabCount(tab);

      <button
        [id]="'tab-btn-' + tab.id"
        (click)="state.setTab(tab.id)"
        class="flex items-center space-x-2 px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-150"
        [ngClass]="isActive ? 'bg-indigo-50 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 shadow-2xs' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 border border-transparent'"
      >
        <app-icon
          [name]="tab.icon"
          class="w-4 h-4 transition"
          [ngClass]="isActive ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400 dark:text-slate-500'"
        ></app-icon>
        <span>{{ tab.label }}</span>

        <!-- Count badges -->
        @if (count !== undefined && count > 0) {
          <span
            class="text-[10px] px-1.5 py-0.5 rounded-full font-bold leading-none"
            [ngClass]="isActive ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700'"
          >
            {{ count }}
          </span>
        }

        <!-- Tag Badges -->
        @if (tab.badge) {
          <span class="hidden md:inline-block text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-medium">
            {{ tab.badge }}
          </span>
        }
      </button>
    }
  </div>
</nav>
